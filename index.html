<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Inter:wght@600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --navy:#0B1229;
    --navy-2:#141b3a;
    --navy-3:#1c2650;
    --paper:#F5F5F9;
    --card:#FFFFFF;
    --ink:#121420;
    --muted:#888ea3;
    --muted-2:#c6c9d6;
    --line:#e7e7ef;

    --blue:#2F6FED;      --blue-soft:#E9F0FF;
    --green:#17A06B;     --green-soft:#E5F7EF;
    --orange:#E8790F;    --orange-soft:#FDEEE0;
    --purple:#8B5CF6;    --purple-soft:#F2ECFE;
    --yellow:#FFD400;

    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:10px;
    --shadow: 0 10px 30px rgba(11,18,41,0.10);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:#05070f;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Outfit',sans-serif;
    font-weight:900;
    letter-spacing:-0.02em;
    margin:0;
  }
  .mono{font-family:'JetBrains Mono',monospace; font-weight:700;}

  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}

  /* ---------- App shell ---------- */
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    position:relative;
    display:flex;
    flex-direction:column;
    box-shadow:var(--shadow);
  }
  @media (min-width:481px){
    body{padding:28px 0;}
    .app{min-height:calc(100vh - 56px); border-radius:32px; overflow:hidden;}
  }

  /* ---------- Header ---------- */
  .header{
    background:linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%);
    color:#fff;
    padding:calc(20px + env(safe-area-inset-top)) 20px 22px;
    position:sticky;
    top:0;
    z-index:20;
  }
  .header-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
  }
  .header .trip-name{
    font-size:30px;
    line-height:1.05;
    text-transform:none;
  }
  .today-btn{
    flex:0 0 auto;
    background:var(--yellow);
    color:var(--navy);
    border:none;
    border-radius:20px;
    padding:9px 16px;
    font-weight:800;
    font-size:12.5px;
    font-family:'Inter',sans-serif;
    white-space:nowrap;
    margin-top:2px;
  }
  .today-btn:active{opacity:0.85;}
  .header .trip-sub{
    margin-top:6px;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13.5px;
    color:#a8b0d0;
  }
  .header .trip-sub .flagchip{margin-right:2px;}

  /* ---------- Tab bar ---------- */
  .tabbar{
    display:flex;
    background:var(--navy);
    border-top:1px solid rgba(255,255,255,0.06);
    position:sticky;
    bottom:0;
    z-index:30;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar button{
    flex:1;
    background:none;
    border:none;
    color:#7d84a8;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    padding:10px 2px 12px;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:10.5px;
  }
  .tabbar button .ic{font-size:19px; line-height:1;}
  .tabbar button.active{color:var(--yellow);}

  /* ---------- Main scroll area ---------- */
  .view{
    flex:1;
    padding:18px 16px 26px;
    overflow-y:auto;
  }
  .view.hidden{display:none;}

  /* ---------- Date chip strip ---------- */
  .datebar{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:16px;
  }
  .datebar .arrow{
    flex:0 0 auto;
    width:34px;height:34px;
    border-radius:50%;
    border:none;
    background:var(--navy);
    color:var(--yellow);
    font-size:16px;
    font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .chips{
    display:flex;
    gap:8px;
    overflow-x:auto;
    scroll-behavior:smooth;
    padding:2px 2px 6px;
    flex:1;
    scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    min-width:52px;
    padding:8px 6px;
    border-radius:14px;
    background:#fff;

  .chip.active .dn{color:#0B1229;}

  .selected-date-heading{
    font-size:20px;
    margin:2px 0 14px;
  }

  .card{
    background:var(--card);
    border-radius:var(--radius-lg);
    padding:16px 16px 15px;
    margin-bottom:14px;
    border:1.5px solid var(--line);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0;
    width:6px;
  }
  .card.c-blue::before{background:var(--blue);}
  .card.c-green::before{background:var(--green);}
  .card.c-orange::before{background:var(--orange);}
  .card.c-purple::before{background:var(--purple);}

  .card .tag{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    font-weight:700;
    padding:4px 9px;
    border-radius:20px;
    margin-bottom:10px;
  }
  .tag.blue{background:var(--blue-soft); color:var(--blue);}
  .tag.green{background:var(--green-soft); color:var(--green);}
  .tag.orange{background:var(--orange-soft); color:var(--orange);}
  .tag.purple{background:var(--purple-soft); color:var(--purple);}

  .card h3{font-size:17px; margin-bottom:2px;}
  .card .sub{font-size:12.5px; color:var(--muted); font-weight:600; margin-top:2px;}

  .empty{
    background:#eceef4;
    border:1.5px dashed #cfd2e0;
    border-radius:var(--radius-lg);
    padding:20px 16px;
    text-align:center;
    color:var(--muted);
    font-weight:600;
    font-size:13.5px;
  }

  /* activity rows inside itinerary card */
  .act-row{
    display:flex;
    gap:10px;
    align-items:flex-start;
    padding:8px 0;
    border-top:1px solid var(--line);
  }
  .act-row:first-of-type{border-top:none; padding-top:2px;}
  .act-row .emoji{font-size:18px; width:22px; text-align:center; flex:0 0 auto;}
  .act-row .time{font-family:'JetBrains Mono',monospace; font-weight:700; font-size:12.5px; color:var(--purple); flex:0 0 64px;}
  .act-row .txt{font-weight:600; font-size:14px; line-height:1.35;}

  .session-row .time{flex:0 0 64px; padding-top:2px;}
  .session-body{flex:1; min-width:0;}
  .track-pill{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:10.5px;
    font-weight:700;
    padding:3px 8px;
    border-radius:20px;
    margin-bottom:5px;
    white-space:nowrap;

  .session-role{font-weight:600; font-size:12px; color:var(--muted); margin-top:1px; line-height:1.3;}

  .route-line{
    display:flex; align-items:center; gap:10px; margin:4px 0 10px;
  }
  .route-line .city{font-family:'Outfit',sans-serif; font-weight:800; font-size:19px;}
  .route-line .arrow{color:var(--muted-2); font-size:18px;}
  .time-grid{
    display:flex; gap:22px; margin:10px 0 4px;

  .meta-row{font-size:12.5px; color:var(--muted); font-weight:600; margin-top:4px; line-height:1.5;}
  .meta-row b{color:var(--ink);}

  .list-tap{cursor:pointer;}
  .list-tap:active{opacity:0.85;}

  .section-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .section-head h2{font-size:22px;}
  .addbtn{
    background:var(--navy);

    border:none;
    border-radius:20px;
    padding:9px 15px;
    font-weight:700;
    font-size:13px;
    display:flex; align-items:center; gap:6px;
  }

  /* ---------- Itinerary read-only list ---------- */
  .day-block{margin-bottom:16px;}
  .day-block .day-label{
    font-size:11.5px; font-weight:700; color:var(--purple);
    text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px;
  }

  /* ---------- Bottom sheet ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(6,9,20,0.55);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:100; opacity:0; pointer-events:none;
    transition:opacity .18s ease;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .sheet{
    background:#fff;

    transform:translateY(100%);

  .overlay.show .sheet{transform:translateY(0);}
  .sheet .grabber{width:40px; height:5px; background:var(--muted-2); border-radius:3px; margin:6px auto 14px;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}

    font-size:14.5px;
    color:var(--ink);

  .sheet-actions{display:flex; gap:10px; margin-top:6px;}
  .btn{
    flex:1; border:none; border-radius:var(--radius-sm);

  .btn.primary{background:var(--navy); color:var(--yellow);}
  .btn.ghost{background:#eceef4; color:var(--ink);}
  .btn.danger{background:#fdeaea; color:#c0392b;}

  .toast{
    position:fixed; left:50%; bottom:90px; transform:translateX(-50%);
    background:var(--navy); color:#fff; font-weight:700; font-size:13px;

    white-space:nowrap;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

    if(!parsed.trip || !Array.isArray(parsed.flights)) return defaultState();

}

/* =========================================================================
   DATE HELPERS
   ========================================================================= */
function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function clampToRange(iso){
  if(!state) return iso;
  if(iso < state.trip.startDate) return state.trip.startDate;
  if(iso > state.trip.endDate) return state.trip.endDate;
  return iso;
}
function parseISO(iso){
  const [y,m,d] = iso.split('-').map(Number);
  return new Date(y, m-1, d);
}
function addDays(iso, n){
  const d = parseISO(iso);
  d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dateRange(startIso, endIso){
  const out = [];
  let cur = startIso;
  let guard = 0;
  while(cur <= endIso && guard < 400){
    out.push(cur);
    cur = addDays(cur,1);
    guard++;
  }
  return out;
}
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MO_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function fmtChip(iso){
  const d = parseISO(iso);
  return {wd:WD[d.getDay()], dn:d.getDate()};
}
function fmtShort(iso){
  if(!iso) return '—';
  const d = parseISO(iso);
  return WD[d.getDay()]+', '+MO[d.getMonth()]+' '+d.getDate();
}
function fmtLong(iso){
  if(!iso) return '—';
  const d = parseISO(iso);
  return WD[d.getDay()]+', '+MO_FULL[d.getMonth()]+' '+d.getDate()+', '+d.getFullYear();
}

};
const FLAG_KEYS_SORTED = Object.keys(FLAG_MAP).sort((a,b)=>b.length-a.length);
function getFlag(text){
  const t = (text||'').toLowerCase();
  for(const k of FLAG_KEYS_SORTED){

/* =========================================================================
   CONFERENCE TRACKS
   Each conference/company gets its own emoji + color so session rows are
   visually separated at a glance, without breaking the purple
   itinerary/activities color family.
   ========================================================================= */
const TRACKS = {
  "Precious Metals Summit": {emoji:"🥇", color:"#92660B", bg:"#FBF0D9"},
  "Mining Forum Americas":  {emoji:"⛏️", color:"#0F766E", bg:"#E1F5F2"},
  "Kitco Spotlight":        {emoji:"📣", color:"#BE185D", bg:"#FCE7F3"},
  "Digging Deep":           {emoji:"🎙️", color:"#4338CA", bg:"#E9E7FD"}
};
function trackBadgeHtml(track, label){
  const t = TRACKS[track] || {emoji:"🎤", color:"#555", bg:"#eee"};
  const lbl = label ? ' · ' + escapeHtml(label) : '';
  return `<span class="track-pill" style="color:${t.color};background:${t.bg};">${t.emoji} ${escapeHtml(track)}${lbl}</span>`;
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function flagify(text){
  if(!text) return '';
  let result = escapeHtml(text);
  // Insert a flag right before every recognized city name found in the text
  // (longest names first so "Colorado Springs" is matched before "Colorado").
  for(const key of FLAG_KEYS_SORTED){
    const flag = FLAG_MAP[key];
    const escapedKey = key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp('(' + escapedKey + ')', 'gi');
    result = result.replace(re, (match) => `${flag} ${match}`);
  }
  return result;
}

function hotelForNight(iso){
  return state.hotels.find(h => iso >= h.checkIn && iso < h.checkOut) || null;

  return state.transit.find(t => t.date===iso && t.overnight) || null;
}

  return state.transit.filter(t => t.date===iso && !t.overnight);

  ]
};
const SHEET_TITLES = {flight:'Flight', hotel:'Hotel', transit:'Transit leg'};
const SHEET_STORE = {flight:'flights', hotel:'hotels', transit:'transit'};

function openSheet(type, id){
  editingType = type;
  editingId = id || null;
  const fields = SHEET_FIELDS[type];
  const item = editingId ? state[SHEET_STORE[type]].find(x=>x.id===editingId) : null;

  let fieldsHtml = fields.map(f=>{
    const val = item ? (item[f.k] ?? '') : '';
    if(f.t === 'textarea'){
      return `<div class="field"><label>${f.l}</label><textarea id="f_${f.k}">${escapeHtml(val)}</textarea></div>`;
    }
    if(f.t === 'checkbox'){
      return `<div class="field" style="display:flex;align-items:center;gap:8px;">
        <input type="checkbox" id="f_${f.k}" ${val? 'checked':''} style="width:18px;height:18px;">
        <label style="margin:0;">${f.l}</label>
      </div>`;
    }
    return `<div class="field"><label>${f.l}</label><input id="f_${f.k}" type="${f.t}" value="${escapeHtml(val)}" placeholder="${f.ph||''}"></div>`;
  }).join('');

  document.getElementById('sheetBody').innerHTML = `
    <h2>${editingId ? 'Edit' : 'Add'} ${SHEET_TITLES[type]}</h2>
    <form onsubmit="return false;">
      ${fieldsHtml}
      <div class="sheet-actions">
        ${editingId ? `<button type="button" class="btn danger" onclick="deleteSheetItem()">Delete</button>` : ''}
        <button type="button" class="btn ghost" onclick="closeSheet()">Cancel</button>
        <button type="button" class="btn primary" onclick="saveSheetItem()">Save</button>
      </div>
    </form>
  `;
  document.getElementById('overlay').classList.add('show');
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('show');
  editingType = null; editingId = null;
}
function saveSheetItem(){
  const type = editingType;
  const fields = SHEET_FIELDS[type];
  const obj = editingId ? {...state[SHEET_STORE[type]].find(x=>x.id===editingId)} : {id:uid()};
  for(const f of fields){
    const el = document.getElementById('f_'+f.k);
    obj[f.k] = f.t==='checkbox' ? el.checked : el.value.trim();
  }
  const arr = state[SHEET_STORE[type]];
  const idx = arr.findIndex(x=>x.id===obj.id);
  if(idx>=0) arr[idx] = obj; else arr.push(obj);
  saveState();
  closeSheet();
  renderTabContent(currentTab);
  if(currentTab==='today') renderToday();
  showToast('Saved');
}
function deleteSheetItem(){
  if(!confirm('Delete this entry?')) return;
  const type = editingType;
  const arr = state[SHEET_STORE[type]];
  const idx = arr.findIndex(x=>x.id===editingId);
  if(idx>=0) arr.splice(idx,1);
  saveState();
  closeSheet();
  renderTabContent(currentTab);
  if(currentTab==='today') renderToday();
  showToast('Deleted');
}

function renderTabContent(tab){
  if(tab==='today') renderToday();
  else if(tab==='itinerary') renderItinerary();
  else if(tab==='flights') renderFlights();
  else if(tab==='hotels') renderHotels();
  else if(tab==='transit') renderTransit();
}
function goToToday(){
  selectedDate = clampToRange(todayISO());
  switchTab('today');
}
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));
  document.getElementById('view-'+tab).classList.remove('hidden');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  renderTabContent(tab);
}
function renderAll(){
  renderHeader();
  renderTabContent(currentTab);
}

/* =========================================================================
   INIT
   ========================================================================= */
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if(btn.dataset.tab === 'today') goToToday();
    else switchTab(btn.dataset.tab);
  });
});
document.getElementById('prevDay').addEventListener('click', ()=>shiftDate(-1));
document.getElementById('nextDay').addEventListener('click', ()=>shiftDate(1));

renderAll();

/* =========================================================================
   PWA manifest via Blob (keeps this a single self-contained file)
   ========================================================================= */
(function(){
  try{
    const iconDataUri = document.querySelector('link[rel="icon"]').href;
    const manifest = {
      name: state.trip.name,
      short_name: state.trip.name.slice(0,12),
      start_url: ".",
      display: "standalone",
      background_color: "#0B1229",
      theme_color: "#0B1229",
      icons: [
        {src: iconDataUri, sizes:"192x192", type:"image/png"},
        {src: iconDataUri, sizes:"512x512", type:"image/png"}
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = url;
    document.head.appendChild(link);
  }catch(e){ /* manifest is a progressive enhancement, ignore failures */ }
})();
</script>
